name: CI

on:
  # Scoped to main deliberately. With `push: ["**"]` every push to a branch
  # with an open PR fired a SECOND identical run, which cost double the billed
  # minutes and, worse, produced a FALSE RED: on a branch's first push
  # `github.event.before` has no valid base, so golangci-lint-action's
  # only-new-issues patch fetch 404s ("failed to fetch push patch"), it falls
  # back to a whole-repo scan, and that fails on pre-existing lint debt the
  # diff never touched. Observed on PR #306: run 32130514156 (push) failed
  # while run 32130533868 (pull_request) passed on the SAME commit. That red
  # is why #303/#304 needed `--admin` overrides. Merge gating reads the PR's
  # statusCheckRollup, so pull_request runs are what is consumed and scoping
  # push to main loses no coverage.
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # golangci-lint-action only-new-issues needs the base commit to diff
          # against; a shallow clone makes its patch-fetch 404 and fall back to a
          # whole-repo scan that fails on pre-existing lint debt.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install sqlite build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libsqlite3-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m
          only-new-issues: true

      # Blocking gate: runtime source graph only (no -test).
      # This preserves signal for real shipped vulnerabilities.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck (runtime, blocking)
        run: |
          govulncheck -json ./... > govulncheck-runtime.json
          # Fail only on actionable findings (package/symbol/imported),
          # not on module-only inventory messages.
          actionable_count="$(jq -r '
            select(.finding != null)
            | .finding.trace[0] as $f
            | select((($f.package // "") != "") or (($f.function // "") != ""))
            | .finding.osv
          ' govulncheck-runtime.json | sort -u | wc -l)"
          if [ "${actionable_count}" -gt 0 ]; then
            echo "Actionable runtime vulnerabilities found: ${actionable_count}"
            jq -r '
              select(.finding != null)
              | .finding.trace[0] as $f
              | select((($f.package // "") != "") or (($f.function // "") != ""))
              | .finding.osv
            ' govulncheck-runtime.json | sort -u
            exit 1
          fi

      # Non-blocking inventory: include test graph so dockertest/docker transitive
      # vulnerabilities stay visible. This step intentionally does NOT fail CI for
      # known test-only docker surfaces; runtime gate above remains blocking.
      - name: govulncheck (test graph inventory, non-blocking)
        run: |
          set +e
          govulncheck -json -test ./... > govulncheck-test.json
          status=$?
          set -e
          echo "govulncheck -test exit code: ${status}"
          echo "Test-graph vulnerability OSV IDs (visibility-only):"
          jq -r 'select(.finding != null) | .finding.osv' govulncheck-test.json | sort -u
          echo "Top modules with findings (visibility-only):"
          jq -r '
            select(.finding != null)
            | .finding.trace[0].module // "unknown-module"
          ' govulncheck-test.json | sort | uniq -c | sort -nr

      - name: Test
        env:
          FACTVAULT_TEST_POSTGRES_IMAGE: ankane/pgvector:latest
        run: go test ./... -count=1

      - name: Test (repeat for flake detection)
        env:
          FACTVAULT_TEST_POSTGRES_IMAGE: ankane/pgvector:latest
        run: go test ./... -count=1

      - name: Test (race)
        run: go test -race ./... -count=1

      - name: Test database leak gate
        env:
          TESTDB_LEAK_GATE: "1"
        run: go test ./internal/testdb -run '^TestNoTestDBLeaks$' -count=1

  embedder:
    name: embedder pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install embedder deps
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest httpx numpy

      - name: Run embedder tests
        env:
          PYTHONPATH: services/embedder
        run: pytest services/embedder/tests -v --tb=short

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
