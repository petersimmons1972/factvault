name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: pytest (postgres + pgvector)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/db/ -v
        env:
          # testcontainers-python spins up the container using the published pgvector image.
          # The FACTVAULT_TEST_POSTGRES_IMAGE env var allows overriding the default image.
          # CI uses the published image directly — no local Dockerfile build required.
          FACTVAULT_TEST_POSTGRES_IMAGE: pgvector/pgvector:pg16
