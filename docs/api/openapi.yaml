openapi: 3.1.0
info:
  title: factvault API
  version: 0.1.0
paths:
  /healthz:
    get:
      responses:
        "200":
          description: service health
  /readyz:
    get:
      responses:
        "200":
          description: database readiness
  /entities/{id}/dossier:
    get:
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: entity dossier bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
        "401":
          description: missing or invalid JWT
        "404":
          description: entity not found
  /stories:
    post:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryRequest"
      responses:
        "200":
          description: graph-expanded story bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
  /facts/query:
    post:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactsQueryRequest"
      responses:
        "200":
          description: fact query bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
  /briefs/generate:
    post:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateBriefRequest"
      responses:
        "200":
          description: generated and persisted evidence brief record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceBrief"
  /briefs:
    get:
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: source_kind
          in: query
          required: false
          schema:
            type: string
            enum: [dossier, story]
        - name: entity_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: created_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: brief records ordered by created_at desc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceBrief"
  /briefs/{id}:
    get:
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: one persisted brief record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceBrief"
        "404":
          description: brief not found for tenant
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StoryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        depth:
          type: integer
          minimum: 1
          maximum: 3
        max_facts:
          type: integer
        min_confidence:
          type: number
    FactsQueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        max_facts:
          type: integer
        min_confidence:
          type: number
    GenerateBriefRequest:
      type: object
      required: [source_kind]
      description: Bundle assembly happens server-side under the authenticated tenant. Client-supplied bundle JSON is rejected.
      properties:
        source_kind:
          type: string
          enum: [dossier, story]
        entity_id:
          type: string
          format: uuid
          description: Required when source_kind is dossier.
        query:
          type: string
          description: Required when source_kind is story.
    EvidenceBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        entity_id:
          type: string
          format: uuid
          nullable: true
        query:
          type: string
          nullable: true
        source_kind:
          type: string
          enum: [dossier, story]
        bundle_hash:
          type: string
        brief:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    # Bundle schemas match internal/assembler/bundle.go json tags exactly.
    # omitempty fields are optional; all other fields are required.
    Bundle:
      type: object
      description: Canonical JSON shape produced by assembler.Assemble for dossier/story endpoints.
      required: [entity_id, entities, statements, sources, assembled_at, tenant_id]
      properties:
        entity_id:
          type: string
          format: uuid
          description: Primary seed entity for this assembly.
        entities:
          type: array
          items:
            $ref: "#/components/schemas/BundleEntity"
        statements:
          type: array
          items:
            $ref: "#/components/schemas/BundleStatement"
        sources:
          type: array
          description: Top-level source array; statements reference these by source_ids.
          items:
            $ref: "#/components/schemas/BundleSource"
        qualifiers:
          type: array
          description: Omitted when empty (omitempty).
          items:
            $ref: "#/components/schemas/BundleQualifier"
        relations:
          type: array
          description: Omitted when empty (omitempty).
          items:
            $ref: "#/components/schemas/BundleRelation"
        assembled_at:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
    BundleEntity:
      type: object
      required: [id, name, type_uri]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        canonical_name:
          type: string
          description: Omitted when null (omitempty); sourced from entities.ext_id.
        type_uri:
          type: string
        description:
          type: string
          description: Omitted when null (omitempty).
    BundleStatement:
      type: object
      required: [id, entity_id, property_slug, value, value_type, rank, confidence, source_ids]
      properties:
        id:
          type: string
          format: uuid
        entity_id:
          type: string
          format: uuid
        property_slug:
          type: string
        value:
          type: string
          description: Flattened statement value (entity UUID, text, number, date, or JSON string).
        value_type:
          type: string
        rank:
          type: integer
          description: 1=preferred, 2=normal, 3=deprecated.
        confidence:
          type: number
        source_ids:
          type: array
          items:
            type: string
            format: uuid
        qualifier_ids:
          type: array
          description: Omitted when empty (omitempty).
          items:
            type: string
            format: uuid
    BundleSource:
      type: object
      required: [id, url, verification_status, raw_text, excerpt_offset_start, excerpt_offset_end]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        archive_url:
          type: string
          description: Omitted when null (omitempty).
        published_at:
          type: string
          format: date-time
          description: Omitted when null (omitempty); RFC3339.
        verification_status:
          type: string
          description: Source status from the sources table (e.g. collected, archived, verified).
        raw_text:
          type: string
          description: Excerpt text linked via statement_sources (not a separate excerpt field).
        excerpt_offset_start:
          type: integer
        excerpt_offset_end:
          type: integer
    BundleQualifier:
      type: object
      required: [id, statement_id, property_slug, value, value_type]
      properties:
        id:
          type: string
          format: uuid
        statement_id:
          type: string
          format: uuid
        property_slug:
          type: string
        value:
          type: string
        value_type:
          type: string
    BundleRelation:
      type: object
      required: [id, source_entity_id, target_entity_id, relation_type_slug, confidence]
      properties:
        id:
          type: string
          format: uuid
        source_entity_id:
          type: string
          format: uuid
        target_entity_id:
          type: string
          format: uuid
        relation_type_slug:
          type: string
        confidence:
          type: number
