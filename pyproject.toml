[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factvault"
version = "0.0.1"
requires-python = ">=3.12,<3.14"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "pgvector>=0.3,<1",
    "pydantic>=2,<3",
    "httpx>=0.27,<1",
    "trafilatura>=1.9,<2",
    "feedparser>=6.0,<7",
    "click>=8,<9",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "testcontainers[postgres]>=4,<5",
    "pytest-asyncio>=0.23,<1",
    "pytest-httpx>=0.30,<1",
]

[project.scripts]
factvault-worker = "factvault.workers.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["factvault"]
