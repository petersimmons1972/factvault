apiVersion: batch/v1
kind: CronJob
metadata:
  name: factvault-dossier
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 65532
          containers:
            - name: factvault-dossier
              image: factvault-app:latest
              args: ["factvault", "worker", "dossier", "--tenant", "$(FACTVAULT_TENANT_ID)"]
              envFrom:
                - configMapRef:
                    name: factvault-config
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
