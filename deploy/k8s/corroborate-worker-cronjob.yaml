apiVersion: batch/v1
kind: CronJob
metadata:
  name: factvault-corroborate
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 65532
          containers:
            - name: factvault-corroborate
              image: factvault-app:latest
              args: ["/bin/sh", "-c", "factvault migrate && factvault worker corroborate --tenant $(FACTVAULT_DEV_TENANT_ID)"]
              envFrom:
                - configMapRef:
                    name: factvault-config
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
