apiVersion: batch/v1
kind: CronJob
metadata:
  name: factvault-corroborate
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 65532
          initContainers:
            - name: factvault-migrate
              image: factvault-app:latest
              args: ["factvault", "migrate"]
              envFrom:
                - configMapRef:
                    name: factvault-config
                - secretRef:
                    name: factvault-db-credentials
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: factvault-corroborate
              image: factvault-app:latest
              args: ["factvault", "worker", "corroborate", "--tenant", "$(FACTVAULT_TENANT_ID)"]
              envFrom:
                - configMapRef:
                    name: factvault-config
                - secretRef:
                    name: factvault-db-credentials
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
