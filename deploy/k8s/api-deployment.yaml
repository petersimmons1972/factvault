apiVersion: apps/v1
kind: Deployment
metadata:
  name: factvault-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factvault-api
  template:
    metadata:
      labels:
        app: factvault-api
    spec:
      securityContext:
        fsGroup: 65532
      initContainers:
        - name: factvault-migrate
          image: factvault-app:latest
          args: ["factvault", "migrate"]
          envFrom:
            - configMapRef:
                name: factvault-config
            - secretRef:
                name: factvault-db-credentials
            # Migrations create extensions and run DDL (CREATE EXTENSION
            # pgcrypto/vector/pg_trgm, GRANTs), which the runtime app_user DSN
            # above cannot do. FACTVAULT_MIGRATE_DATABASE_URL from this Secret
            # takes precedence in cmd/factvault/migrate.go; only this
            # initContainer (and the standalone migrate Job) receive it —
            # runtime containers stay on the app-user DSN only. See #272.
            - secretRef:
                name: factvault-migrate-credentials
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      containers:
        - name: factvault
          image: factvault-app:latest
          args: ["factvault", "api", "--addr", ":8080"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: factvault-config
            - secretRef:
                name: factvault-db-credentials
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          # readOnlyRootFilesystem: true above means the entrypoint's JWT auth
          # bootstrap (see deploy/docker/entrypoint.sh, #271) needs a writable
          # path for /var/lib/factvault/auth even though the rest of the root
          # filesystem stays read-only. This container is the only one that
          # runs "factvault api" — the one command the entrypoint bootstraps
          # auth material for — so it is the only one that needs this mount.
          volumeMounts:
            - name: auth
              mountPath: /var/lib/factvault/auth
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: auth
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: factvault-api
spec:
  selector:
    app: factvault-api
  ports:
    - port: 8080
      targetPort: 8080
