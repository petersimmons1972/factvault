apiVersion: apps/v1
kind: Deployment
metadata:
  name: factvault-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factvault-api
  template:
    metadata:
      labels:
        app: factvault-api
    spec:
      securityContext:
        fsGroup: 65532
      initContainers:
        - name: factvault-migrate
          image: factvault-app:latest
          args: ["factvault", "migrate"]
          envFrom:
            - configMapRef:
                name: factvault-config
            - secretRef:
                name: factvault-db-credentials
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      containers:
        - name: factvault
          image: factvault-app:latest
          args: ["factvault", "api", "--addr", ":8080"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: factvault-config
            - secretRef:
                name: factvault-db-credentials
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: factvault-api
spec:
  selector:
    app: factvault-api
  ports:
    - port: 8080
      targetPort: 8080
