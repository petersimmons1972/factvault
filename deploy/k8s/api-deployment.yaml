apiVersion: apps/v1
kind: Deployment
metadata:
  name: factvault-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factvault-api
  template:
    metadata:
      labels:
        app: factvault-api
    spec:
      securityContext:
        fsGroup: 65532
      initContainers:
        - name: factvault-migrate
          image: factvault-app:latest
          args: ["factvault", "migrate"]
          envFrom:
            - configMapRef:
                name: factvault-config
            - secretRef:
                name: factvault-db-credentials
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: factvault
          image: factvault-app:latest
          args: ["factvault", "api", "--addr", ":8080"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: factvault-config
            - secretRef:
                name: factvault-db-credentials
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: factvault-api
spec:
  selector:
    app: factvault-api
  ports:
    - port: 8080
      targetPort: 8080
