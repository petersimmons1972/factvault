# deploy/k8s/examples/secret.example.yaml — EXAMPLE / TEMPLATE
#
# This file lives under examples/ so that a bare `kubectl apply -f deploy/k8s/`
# (which does NOT recurse into subdirectories) cannot accidentally deploy a
# non-functional Secret. To use it:
#
#   cp deploy/k8s/examples/secret.example.yaml deploy/k8s/secret.yaml
#   # edit deploy/k8s/secret.yaml: replace placeholders with real values
#   kubectl apply -f deploy/k8s/secret.yaml
#
# The working copy `deploy/k8s/secret.yaml` is gitignored — see .gitignore.
#
# Do NOT commit real credentials here.
# In production, populate factvault-db-credentials via Infisical / ExternalSecrets:
#
#   1. Store the DSN in Infisical under the factvault project:
#        key:   FACTVAULT_DATABASE_URL
#        value: postgres://app_user:<password>@<host>:5432/factvault?sslmode=require
#
#   2. Create an ExternalSecret (or use infisical-operator) that syncs the
#      Infisical secret to a Kubernetes Secret named factvault-db-credentials
#      in the factvault namespace.
#
#   3. Reference the Secret in your Deployments / Jobs as shown in
#      api-deployment.yaml and migrate-job.yaml (envFrom secretRef).
#
# For local testing ONLY (no Infisical), you may create the Secret manually:
#   kubectl create secret generic factvault-db-credentials \
#     --from-literal=FACTVAULT_DATABASE_URL='postgres://app_user:<password>@postgres:5432/factvault?sslmode=disable' \
#     -n factvault
#
# The app_user role is created on first Postgres init by your database init
# layer, the provider user API, or the bootstrap Job example at
# deploy/k8s/examples/postgres-app-user-init.example.yaml (see
# docs/operator-guide.md § Kubernetes Credentials). The password you supply here
# MUST match the one used when the role was created.
#
apiVersion: v1
kind: Secret
metadata:
  name: factvault-db-credentials
  namespace: factvault   # adjust to your namespace
type: Opaque
stringData:
  # Replace the whole value with the actual DSN. The placeholder appears in the
  # password position only to keep the example URI shape visible.
  FACTVAULT_DATABASE_URL: "postgres://app_user:<REPLACE_WITH_INFISICAL_MANAGED_VALUE>@postgres:5432/factvault?sslmode=require"
---
# factvault-migrate-credentials — separate, privileged DSN used ONLY by the
# factvault-migrate initContainers/Job (see #272).
#
# Migrations run `CREATE EXTENSION pgcrypto/vector/pg_trgm` and other DDL that
# the runtime `app_user` role (factvault-db-credentials above) is deliberately
# NOT granted, so the migrate step needs its own, more privileged DSN — e.g.
# the Postgres superuser or a migration-only role with CREATEDB/DDL rights.
# cmd/factvault/migrate.go reads FACTVAULT_MIGRATE_DATABASE_URL first and
# falls back to FACTVAULT_DATABASE_URL only if it is unset, matching the
# docker-compose factvault-migrate service.
#
# Store this DSN in Infisical alongside FACTVAULT_DATABASE_URL:
#   key:   FACTVAULT_MIGRATE_DATABASE_URL
#   value: postgres://<migration-role>:<password>@<host>:5432/factvault?sslmode=require
#
# For local testing ONLY (no Infisical):
#   kubectl create secret generic factvault-migrate-credentials \
#     --from-literal=FACTVAULT_MIGRATE_DATABASE_URL='postgres://factvault:factvault@postgres:5432/factvault?sslmode=disable' \
#     -n factvault
#
# Only the factvault-migrate initContainers (api-deployment.yaml, the six
# *-worker-cronjob.yaml files) and the standalone migrate-job.yaml Job
# reference this Secret. Runtime containers (the api server, worker
# containers) intentionally reference only factvault-db-credentials.
apiVersion: v1
kind: Secret
metadata:
  name: factvault-migrate-credentials
  namespace: factvault   # adjust to your namespace
type: Opaque
stringData:
  FACTVAULT_MIGRATE_DATABASE_URL: "postgres://<REPLACE_WITH_MIGRATION_ROLE>:<REPLACE_WITH_INFISICAL_MANAGED_VALUE>@postgres:5432/factvault?sslmode=require"
