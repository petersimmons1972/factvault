apiVersion: apps/v1
kind: Deployment
metadata:
  name: factvault-embedder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factvault-embedder
  template:
    metadata:
      labels:
        app: factvault-embedder
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: embedder
          image: factvault-embedder:latest
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: factvault-embedder
spec:
  selector:
    app: factvault-embedder
  ports:
    - port: 8080
      targetPort: 8080
