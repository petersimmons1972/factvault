apiVersion: batch/v1
kind: CronJob
metadata:
  name: factvault-verify
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 65532
          initContainers:
            - name: factvault-migrate
              image: factvault-app:latest
              args: ["factvault", "migrate"]
              envFrom:
                - configMapRef:
                    name: factvault-config
                - secretRef:
                    name: factvault-db-credentials
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 65532
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
          containers:
            - name: factvault-verify
              image: factvault-app:latest
              args: ["factvault", "worker", "verify", "--tenant", "$(FACTVAULT_TENANT_ID)"]
              envFrom:
                - configMapRef:
                    name: factvault-config
                - secretRef:
                    name: factvault-db-credentials
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 65532
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "1Gi"
