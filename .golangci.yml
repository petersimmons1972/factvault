version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - errorlint
    - govet
    - staticcheck
    - gosec
    - revive
    - gci
    - gofumpt
    - bodyclose
    - contextcheck
    - modernize

linters-settings:
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/petersimmons1972/factvault)
  errcheck:
    check-type-assertions: true
    check-blank: true
  gosec:
    excludes:
      - G404

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
