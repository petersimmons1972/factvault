version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - errorlint
    - govet
    - staticcheck
    - gosec
    - revive
    - bodyclose
    - contextcheck
    - modernize
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gosec:
      excludes:
        - G404

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/petersimmons1972/factvault)

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
