services:
  postgres:
    image: "${FACTVAULT_POSTGRES_IMAGE:-ankane/pgvector:latest}"
    ports:
      - "${FACTVAULT_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-factvault}"
      POSTGRES_USER: "${POSTGRES_USER:-factvault}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-factvault}"
      # POSTGRES_APP_USER_PASSWORD seeds the app_user login role on first init.
      # The default is safe ONLY for local development — override this value for
      # any non-local deployment (staging, CI with external Postgres, production).
      POSTGRES_APP_USER_PASSWORD: "${POSTGRES_APP_USER_PASSWORD:-dev_only_local_password}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init script runs once on first Postgres init (empty pgdata); creates app_user
      - ./deploy/initdb/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  embedder:
    build:
      context: services/embedder
      dockerfile: Dockerfile
    image: factvault-embedder:latest
    ports:
      - "${FACTVAULT_EMBEDDER_PORT:-8081}:8080"
    volumes:
      - embedder-cache:/home/nonroot/.cache
    environment:
      HF_HOME: /home/nonroot/.cache
      SENTENCE_TRANSFORMERS_HOME: /home/nonroot/.cache
      EMBEDDER_MODEL: "${EMBEDDER_MODEL:-BAAI/bge-m3}"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/healthz\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${FACTVAULT_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12

  factvault-migrate:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: factvault-app:latest
    command: ["factvault", "migrate"]
    environment:
      # Migrate runs as the Postgres superuser because the schema needs
      # CREATE EXTENSION (pgcrypto, vector, pg_trgm). Application services
      # (api/workers/mcp) connect as app_user instead — see *factvault-env.
      FACTVAULT_DATABASE_URL: "${FACTVAULT_MIGRATE_DATABASE_URL:-postgres://factvault:factvault@postgres:5432/factvault?sslmode=disable}"
      FACTVAULT_AUTH_DIR: "/var/lib/factvault/auth"
    volumes:
      - factvault-auth:/var/lib/factvault/auth
    depends_on:
      postgres:
        condition: service_healthy
    user: "65532:65532"
    restart: "no"

  factvault-api:
    image: factvault-app:latest
    command: ["factvault", "api", "--addr", ":8080"]
    ports:
      - "${FACTVAULT_API_PORT:-8080}:8080"
    environment: &factvault-env
      # Application services connect as app_user (matching production), which
      # exercises the GRANTs in the schema end-to-end. The default password
      # tracks POSTGRES_APP_USER_PASSWORD; override FACTVAULT_DATABASE_URL
      # entirely if you need a custom DSN.
      FACTVAULT_DATABASE_URL: "${FACTVAULT_DATABASE_URL:-postgres://app_user:${POSTGRES_APP_USER_PASSWORD:-dev_only_local_password}@postgres:5432/factvault?sslmode=disable}"
      FACTVAULT_AUTH_DIR: "/var/lib/factvault/auth"
      FACTVAULT_DEV_TENANT_ID: "${FACTVAULT_DEV_TENANT_ID:-11111111-1111-1111-1111-111111111111}"
      FACTVAULT_EMBEDDER_URL: "${FACTVAULT_EMBEDDER_URL:-http://embedder:8080}"
      FACTVAULT_LLM_BASE_URL: "${FACTVAULT_LLM_BASE_URL:-http://ollama:11434/v1}"
      FACTVAULT_LLM_MODEL: "${FACTVAULT_LLM_MODEL:-llama3.1:8b}"
      FACTVAULT_WAYBACK_URL: "${FACTVAULT_WAYBACK_URL:-https://web.archive.org}"
      FACTVAULT_WORKER_LIMIT: "${FACTVAULT_WORKER_LIMIT:-100}"
      FACTVAULT_VERIFY_AGE_DAYS: "${FACTVAULT_VERIFY_AGE_DAYS:-7}"
    volumes:
      - factvault-auth:/var/lib/factvault/auth
    depends_on:
      factvault-migrate:
        condition: service_completed_successfully
      embedder:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "factvault doctor || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
    user: "65532:65532"

  factvault-workers:
    image: factvault-app:latest
    command:
      - /bin/sh
      - -c
      - |
        status_file=/tmp/factvault-workers.status
        echo "starting" > "$$status_file"
        while true; do
          echo "running" > "$$status_file"
          if factvault worker rss --once && \
             factvault worker archive --tenant "$$FACTVAULT_DEV_TENANT_ID" --limit "$$FACTVAULT_WORKER_LIMIT" && \
             factvault worker verify --tenant "$$FACTVAULT_DEV_TENANT_ID" --limit "$$FACTVAULT_WORKER_LIMIT" --age-days "$$FACTVAULT_VERIFY_AGE_DAYS" && \
             factvault worker extract --tenant "$$FACTVAULT_DEV_TENANT_ID" --limit "$$FACTVAULT_WORKER_LIMIT" && \
             factvault worker corroborate --tenant "$$FACTVAULT_DEV_TENANT_ID" --limit "$$FACTVAULT_WORKER_LIMIT" && \
             factvault worker dossier --tenant "$$FACTVAULT_DEV_TENANT_ID" --limit "$$FACTVAULT_WORKER_LIMIT"; then
            echo "ok $$(date -u +%FT%TZ)" > "$$status_file"
            sleep "$${FACTVAULT_WORKER_INTERVAL_SECONDS:-300}"
          else
            echo "error $$(date -u +%FT%TZ)" > "$$status_file"
            sleep "$${FACTVAULT_WORKER_FAILURE_RETRY_SECONDS:-30}"
          fi
        done
    environment: *factvault-env
    volumes:
      - factvault-auth:/var/lib/factvault/auth
    depends_on:
      factvault-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q '^ok ' /tmp/factvault-workers.status"]
      interval: 30s
      timeout: 5s
      retries: 5
    user: "65532:65532"

  factvault-mcp:
    image: factvault-app:latest
    command: ["factvault", "mcp"]
    environment: *factvault-env
    volumes:
      - factvault-auth:/var/lib/factvault/auth
    depends_on:
      factvault-migrate:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    user: "65532:65532"

volumes:
  pgdata:
  embedder-cache:
  ollama:
  factvault-auth:
