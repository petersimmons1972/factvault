services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: "${FACTVAULT_POSTGRES_IMAGE:-factvault-postgres:latest}"
    ports:
      - "${FACTVAULT_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-factvault}"
      POSTGRES_USER: "${POSTGRES_USER:-factvault}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-factvault}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  embedder:
    build:
      context: .
      dockerfile: deploy/docker/embedder.Dockerfile
    image: factvault-embedder:latest
    ports:
      - "${FACTVAULT_EMBEDDER_PORT:-8081}:8080"
    volumes:
      - embedder-cache:/home/nonroot/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${FACTVAULT_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12

  factvault-migrate:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: factvault-app:latest
    command: ["factvault", "migrate"]
    environment:
      FACTVAULT_DATABASE_URL: "${FACTVAULT_DATABASE_URL:-postgres://factvault:factvault@postgres:5432/factvault?sslmode=disable}"
      FACTVAULT_AUTH_DIR: "/var/lib/factvault/auth"
    volumes:
      - factvault-auth:/var/lib/factvault/auth
    depends_on:
      postgres:
        condition: service_healthy
    user: "65532:65532"
    restart: "no"

  factvault-api:
    image: factvault-app:latest
    command: ["factvault", "api", "--addr", ":8080"]
    ports:
      - "${FACTVAULT_API_PORT:-8080}:8080"
    environment: &factvault-env
      FACTVAULT_DATABASE_URL: "${FACTVAULT_DATABASE_URL:-postgres://factvault:factvault@postgres:5432/factvault?sslmode=disable}"
      FACTVAULT_AUTH_DIR: "/var/lib/factvault/auth"
      FACTVAULT_DEV_TENANT_ID: "${FACTVAULT_DEV_TENANT_ID:-11111111-1111-1111-1111-111111111111}"
      FACTVAULT_EMBEDDER_URL: "${FACTVAULT_EMBEDDER_URL:-http://embedder:8080}"
      FACTVAULT_LLM_URL: "${FACTVAULT_LLM_URL:-http://ollama:11434/v1}"
      FACTVAULT_LLM_MODEL: "${FACTVAULT_LLM_MODEL:-qwen3:32b}"
      FACTVAULT_WAYBACK_URL: "${FACTVAULT_WAYBACK_URL:-https://web.archive.org}"
      FACTVAULT_WORKER_LIMIT: "${FACTVAULT_WORKER_LIMIT:-100}"
      FACTVAULT_VERIFY_AGE_DAYS: "${FACTVAULT_VERIFY_AGE_DAYS:-7}"
    volumes:
      - factvault-auth:/var/lib/factvault/auth
    depends_on:
      factvault-migrate:
        condition: service_completed_successfully
      embedder:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "factvault doctor || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
    user: "65532:65532"

  factvault-workers:
    image: factvault-app:latest
    command:
      - /bin/sh
      - -c
      - |
        status_file=/tmp/factvault-workers.status
        echo "starting" > "$$status_file"
        while true; do
          echo "running" > "$$status_file"
          if factvault worker collect --tenant "$$FACTVAULT_DEV_TENANT_ID" --limit "$$FACTVAULT_WORKER_LIMIT" && \
             factvault worker archive --tenant "$$FACTVAULT_DEV_TENANT_ID" --limit "$$FACTVAULT_WORKER_LIMIT" && \
             factvault worker verify --tenant "$$FACTVAULT_DEV_TENANT_ID" --limit "$$FACTVAULT_WORKER_LIMIT" --age-days "$$FACTVAULT_VERIFY_AGE_DAYS" && \
             factvault worker extract --tenant "$$FACTVAULT_DEV_TENANT_ID" --limit "$$FACTVAULT_WORKER_LIMIT" && \
             factvault worker corroborate --tenant "$$FACTVAULT_DEV_TENANT_ID" --limit "$$FACTVAULT_WORKER_LIMIT" && \
             factvault worker dossier --tenant "$$FACTVAULT_DEV_TENANT_ID" --limit "$$FACTVAULT_WORKER_LIMIT"; then
            echo "ok $$(date -u +%FT%TZ)" > "$$status_file"
            sleep "$${FACTVAULT_WORKER_INTERVAL_SECONDS:-300}"
          else
            echo "error $$(date -u +%FT%TZ)" > "$$status_file"
            sleep "$${FACTVAULT_WORKER_FAILURE_RETRY_SECONDS:-30}"
          fi
        done
    environment: *factvault-env
    volumes:
      - factvault-auth:/var/lib/factvault/auth
    depends_on:
      factvault-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q '^ok ' /tmp/factvault-workers.status"]
      interval: 30s
      timeout: 5s
      retries: 5
    user: "65532:65532"

  factvault-mcp:
    image: factvault-app:latest
    command: ["factvault", "mcp"]
    environment: *factvault-env
    volumes:
      - factvault-auth:/var/lib/factvault/auth
    depends_on:
      factvault-migrate:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    user: "65532:65532"

volumes:
  pgdata:
  embedder-cache:
  ollama:
  factvault-auth:
